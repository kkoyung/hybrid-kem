[package]
name = "hybrid-kem"
version = "0.1.0"
edition = "2024"

[features]
default = []
getrandom = ["kem/getrandom"]
x-wing = ["dep:x-wing", "x-wing/zeroize"]
zeroize = ["dep:zeroize", "ml-kem/zeroize", "sha3/zeroize", "shake/zeroize"]

[dependencies]
elliptic-curve = { version = "0.14.1", features = ["sec1"] }
hex = "0.4.3"
kem = "0.3.0"
ml-kem = "0.3.2"
p256 = { version = "0.14.0", features = ["ecdh"] }
p384 = { version = "0.14.0", features = ["ecdh"] }
rand = "0.10.2"
sha3 = "0.12.0"
shake = "0.1.0"
x-wing = { version = "0.1.0", optional = true }
zeroize = { version = "1.9.0", optional = true }
